AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS Fargate cluster, task definition, ALB with blue/green target groups,
  and ECS service using CodeDeploy blue/green deployment controller.
  ALB listener on port 80 forwards to blue TG; test listener on port 8080
  forwards to green TG during deployments.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for resource naming

  AppName:
    Type: String
    Description: Application name
    Default: fotos

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 1 for ALB

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 2 for ALB

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 1 for ECS tasks

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 2 for ECS tasks

  AlbSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ALB security group ID

  EcsSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ECS task security group ID

  EcsTaskExecutionRoleArn:
    Type: String
    Description: ECS task execution role ARN

  EcsTaskRoleArn:
    Type: String
    Description: ECS task role ARN

  ECRRepositoryUri:
    Type: String
    Description: ECR repository URI (without tag)

  DBEndpoint:
    Type: String
    Description: RDS endpoint hostname

  DBPort:
    Type: String
    Description: RDS port
    Default: '5432'

  DBName:
    Type: String
    Description: Database name
    Default: fotosdb

  DBSecretArn:
    Type: String
    Description: Secrets Manager ARN for DB credentials

  PhotosBucketName:
    Type: String
    Description: S3 photos bucket name

  CloudFrontDomainName:
    Type: String
    Description: CloudFront distribution domain name

Resources:

  # ── CloudWatch Log Group ───────────────────────────────────────────────────
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}/${AppName}'
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── ECS Cluster ────────────────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-${AppName}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── ECS Task Definition ────────────────────────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-${AppName}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref EcsTaskExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: app
          Image: public.ecr.aws/docker/library/python:3-alpine
          Command:
            - python
            - -m
            - http.server
            - '8080'
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: DB_HOST
              Value: !Ref DBEndpoint
            - Name: DB_PORT
              Value: !Ref DBPort
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: S3_BUCKET_NAME
              Value: !Ref PhotosBucketName
            - Name: CLOUDFRONT_BASE_URL
              Value: !Sub 'https://${CloudFrontDomainName}'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub '${DBSecretArn}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${DBSecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Application Load Balancer ──────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-${AppName}-alb'
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref AlbSgId
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Blue Target Group ──────────────────────────────────────────────────────
  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-${AppName}-tg-blue'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Green Target Group ─────────────────────────────────────────────────────
  TargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-${AppName}-tg-green'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Production Listener (port 80 → Blue TG) ────────────────────────────────
  ALBListenerProd:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBlue

  # ── Test Listener (port 8080 → Green TG) ──────────────────────────────────
  ALBListenerTest:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 8080
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupGreen

  # ── ECS Service ────────────────────────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListenerProd
      - ALBListenerTest
    Properties:
      ServiceName: !Sub '${EnvironmentName}-${AppName}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref EcsSgId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroupBlue
      HealthCheckGracePeriodSeconds: 120
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

Outputs:
  ClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ClusterName'

  ServiceName:
    Description: ECS service name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${EnvironmentName}-ServiceName'

  ALBDNSName:
    Description: ALB DNS name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-ALBDNSName'

  TargetGroupBlueName:
    Description: Blue target group name
    Value: !GetAtt TargetGroupBlue.TargetGroupName
    Export:
      Name: !Sub '${EnvironmentName}-TargetGroupBlueName'

  TargetGroupGreenName:
    Description: Green target group name
    Value: !GetAtt TargetGroupGreen.TargetGroupName
    Export:
      Name: !Sub '${EnvironmentName}-TargetGroupGreenName'

  ALBListenerProdArn:
    Description: Production listener ARN
    Value: !Ref ALBListenerProd
    Export:
      Name: !Sub '${EnvironmentName}-ALBListenerProdArn'

  ALBListenerTestArn:
    Description: Test listener ARN
    Value: !Ref ALBListenerTest
    Export:
      Name: !Sub '${EnvironmentName}-ALBListenerTestArn'

  LogGroupName:
    Description: CloudWatch log group name
    Value: !Ref AppLogGroup
    Export:
      Name: !Sub '${EnvironmentName}-LogGroupName'
