AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS Fargate cluster, task definition, ALB with blue/green target groups,
  and ECS service using CodeDeploy blue/green deployment controller.
  ALB listener on port 80 forwards to blue TG; test listener on port 8080
  forwards to green TG during deployments.
  All runtime config (DB endpoint, bucket name, etc.) is resolved from SSM
  Parameter Store at task startup — no CI-time injection required.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for resource naming

  AppName:
    Type: String
    Description: Application name
    Default: fotos

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 1 for ALB

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 2 for ALB

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 1 for ECS tasks

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 2 for ECS tasks

  AlbSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ALB security group ID

  EcsSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ECS task security group ID

  EcsTaskExecutionRoleArn:
    Type: String
    Description: ECS task execution role ARN

  EcsTaskRoleArn:
    Type: String
    Description: ECS task role ARN

  ECRRepositoryUri:
    Type: String
    Description: ECR repository URI (without tag)

  DBSecretArn:
    Type: String
    Description: >
      Secrets Manager ARN for DB credentials. Used to resolve DB_USER and
      DB_PASSWORD at task startup. All other config comes from SSM.

  ArtifactsBucketName:
    Type: String
    Description: Artifacts S3 bucket name — used as the ALB access log destination

Resources:

  # ── CloudWatch Log Group ───────────────────────────────────────────────────
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}/${AppName}'
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── SSM Parameter: Log Group ──────────────────────────────────────────────
  SSMLogGroupName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/fotos/${EnvironmentName}/log-group-name'
      Type: String
      Value: !Ref AppLogGroup

  # ── ECS Cluster ────────────────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-${AppName}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── ECS Task Definition ────────────────────────────────────────────────────
  # Runtime config is pulled from SSM Parameter Store at task startup via the
  # secrets array. DB credentials come from Secrets Manager directly using the
  # secret ARN. The image here is overwritten by CodeDeploy at deploy time.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-${AppName}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref EcsTaskExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: app
          Image: !Sub '${ECRRepositoryUri}:latest'
          Essential: true
          StopTimeout: 45
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: JAVA_TOOL_OPTIONS
              Value: '-XX:MaxRAMPercentage=75.0'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DB_PORT
              Value: '5432'
          Secrets:
            - Name: DB_HOST
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fotos/${EnvironmentName}/db-endpoint'
            - Name: DB_NAME
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fotos/${EnvironmentName}/db-name'
            - Name: S3_BUCKET_NAME
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fotos/${EnvironmentName}/s3-bucket-name'
            - Name: CLOUDFRONT_BASE_URL
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fotos/${EnvironmentName}/cloudfront-url'
            - Name: DB_USER
              ValueFrom: !Sub '${DBSecretArn}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${DBSecretArn}:password::'
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/actuator/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Application Load Balancer ──────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-${AppName}-alb'
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref AlbSgId
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref ArtifactsBucketName
        - Key: access_logs.s3.prefix
          Value: alb-logs
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Blue Target Group ──────────────────────────────────────────────────────
  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-${AppName}-tg-blue'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Green Target Group ─────────────────────────────────────────────────────
  TargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-${AppName}-tg-green'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Production Listener (port 80 → Blue TG) ────────────────────────────────
  ALBListenerProd:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBlue

  # ── Test Listener (port 8080 → Green TG) ──────────────────────────────────
  ALBListenerTest:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 8080
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupGreen

  # ── ECS Service ────────────────────────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListenerProd
      - ALBListenerTest
    Properties:
      ServiceName: !Sub '${EnvironmentName}-${AppName}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref EcsSgId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroupBlue
      HealthCheckGracePeriodSeconds: 120
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

Outputs:
  ClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ClusterName'

  ServiceName:
    Description: ECS service name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${EnvironmentName}-ServiceName'

  ALBDNSName:
    Description: ALB DNS name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-ALBDNSName'

  TargetGroupBlueName:
    Description: Blue target group name
    Value: !GetAtt TargetGroupBlue.TargetGroupName
    Export:
      Name: !Sub '${EnvironmentName}-TargetGroupBlueName'

  TargetGroupGreenName:
    Description: Green target group name
    Value: !GetAtt TargetGroupGreen.TargetGroupName
    Export:
      Name: !Sub '${EnvironmentName}-TargetGroupGreenName'

  ALBListenerProdArn:
    Description: Production listener ARN
    Value: !Ref ALBListenerProd
    Export:
      Name: !Sub '${EnvironmentName}-ALBListenerProdArn'

  ALBListenerTestArn:
    Description: Test listener ARN
    Value: !Ref ALBListenerTest
    Export:
      Name: !Sub '${EnvironmentName}-ALBListenerTestArn'

  LogGroupName:
    Description: CloudWatch log group name
    Value: !Ref AppLogGroup
    Export:
      Name: !Sub '${EnvironmentName}-LogGroupName'
