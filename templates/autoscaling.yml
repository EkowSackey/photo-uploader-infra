AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Application Auto Scaling for ECS Fargate service.
  Target tracking on ECS CPU utilization (70%) with min 1 / max 4 tasks.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for resource naming

  ClusterName:
    Type: String
    Description: ECS cluster name

  ServiceName:
    Type: String
    Description: ECS service name

Resources:

  # ── Scalable Target ────────────────────────────────────────────────────────
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 4
      MinCapacity: 1
      ResourceId: !Sub 'service/${ClusterName}/${ServiceName}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  # ── CPU Target Tracking Policy ─────────────────────────────────────────────
  CPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-cpu-target-tracking'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
