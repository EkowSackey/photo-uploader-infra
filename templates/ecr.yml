AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECR repository for the fotos application container images.
  Lifecycle policy keeps the last 10 tagged images and expires
  untagged images after 1 day to control storage costs.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for resource naming

  AppName:
    Type: String
    Description: Application name used in repository naming
    Default: fotos

Resources:

  # ── ECR Repository 
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}/${AppName}'
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Keep last 10 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v", "latest", "sha"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Pipeline Artifacts Bucket ──────────────────────────────────────────────
  # Placed in this Tier-0 stack so the prod-ArtifactsBucketName export exists
  # before ECSStack and PipelineStack deploy. GitHub Actions reads this export
  # on every push; having it available from the first deployment breaks the
  # chicken-and-egg dependency with the pipeline stack.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-pipeline-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

Outputs:
  ECRRepositoryUri:
    Description: ECR repository URI
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub '${EnvironmentName}-ECRRepositoryUri'

  ECRRepositoryName:
    Description: ECR repository name
    Value: !Ref ECRRepository
    Export:
      Name: !Sub '${EnvironmentName}-ECRRepositoryName'

  ArtifactsBucketName:
    Description: Pipeline artifacts S3 bucket name
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${EnvironmentName}-ArtifactsBucketName'
