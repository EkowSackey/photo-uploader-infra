AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RDS PostgreSQL 16.3 single-AZ instance in private DB subnets.
  Credentials stored in Secrets Manager with auto-generated password.
  DB subnet group spans both AZs for high-availability readiness.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for resource naming

  DBSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: First DB subnet ID (AZ1)

  DBSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Second DB subnet ID (AZ2)

  RdsSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: RDS security group ID

  RotationLambdaSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for the Secrets Manager rotation Lambda

Resources:

  # ── DB Subnet Group ──────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${EnvironmentName} DB subnet group'
      SubnetIds:
        - !Ref DBSubnet1Id
        - !Ref DBSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-subnet-group'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Secrets Manager — DB Credentials 
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/fotos/db-credentials'
      Description: !Sub 'RDS credentials for ${EnvironmentName} fotos database'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "postgres"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── RDS PostgreSQL Instance ───────────
  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-fotos-db'
      DBName: fotosdb
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSgId
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-fotos-db'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Secret Target Attachment ──────────
  SecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

  # ── Secrets Manager Rotation Schedule ───
  # AWS provisions and manages the rotation Lambda inside the VPC.
  # It connects to RDS on port 5432 to rotate the password every 30 days.
  DBSecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      HostedRotationLambda:
        RotationType: PostgreSQLSingleUser
        RotationLambdaName: !Sub '${EnvironmentName}-fotos-db-rotation'
        VpcSecurityGroupIds: !Ref RotationLambdaSgId
        VpcSubnetIds: !Join [',', [!Ref DBSubnet1Id, !Ref DBSubnet2Id]]
      RotationRules:
        AutomaticallyAfterDays: 30

  # ── SSM Parameters ────────────────────
  SSMDBEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/fotos/${EnvironmentName}/db-endpoint'
      Type: String
      Value: !GetAtt DBInstance.Endpoint.Address

  SSMDBName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/fotos/${EnvironmentName}/db-name'
      Type: String
      Value: fotosdb

  SSMDBSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/fotos/${EnvironmentName}/db-secret-arn'
      Type: String
      Value: !Ref DBSecret

Outputs:
  DBEndpoint:
    Description: RDS instance endpoint
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-DBEndpoint'

  DBPort:
    Description: RDS instance port
    Value: !GetAtt DBInstance.Endpoint.Port
    Export:
      Name: !Sub '${EnvironmentName}-DBPort'

  DBName:
    Description: Database name
    Value: fotosdb
    Export:
      Name: !Sub '${EnvironmentName}-DBName'

  DBSecretArn:
    Description: Secrets Manager ARN for DB credentials
    Value: !Ref DBSecret
    Export:
      Name: !Sub '${EnvironmentName}-DBSecretArn'
