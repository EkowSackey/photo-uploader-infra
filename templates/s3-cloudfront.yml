AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Private S3 bucket for photo storage and a CloudFront distribution with
  Origin Access Control (OAC). All public S3 access is blocked.
  Price Class 200 (North America, Europe, Asia). HTTPS redirect enforced.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for resource naming

Resources:

  # ── S3 Photos Bucket 
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-fotos-photos-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── CloudFront Origin Access Control 
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${EnvironmentName}-fotos-oac'
        Description: OAC for fotos photos bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Distribution 
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${EnvironmentName} fotos CloudFront distribution'
        Enabled: true
        PriceClass: PriceClass_200
        HttpVersion: http2
        DefaultCacheBehavior:
          TargetOriginId: S3PhotosOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized managed policy
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          Compress: true
        Origins:
          - Id: S3PhotosOrigin
            DomainName: !GetAtt PhotosBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        DefaultRootObject: ''
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── Bucket Policy: CloudFront OAC only 
  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PhotosBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:
  PhotosBucketName:
    Description: Photos S3 bucket name
    Value: !Ref PhotosBucket
    Export:
      Name: !Sub '${EnvironmentName}-PhotosBucketName'

  PhotosBucketArn:
    Description: Photos S3 bucket ARN
    Value: !GetAtt PhotosBucket.Arn
    Export:
      Name: !Sub '${EnvironmentName}-PhotosBucketArn'

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${EnvironmentName}-CloudFrontDomainName'

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${EnvironmentName}-CloudFrontDistributionId'
