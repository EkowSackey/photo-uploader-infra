AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Security groups for ALB (public HTTP/HTTPS), ECS tasks (from ALB only),
  and RDS (from ECS only). Least-privilege inbound rules.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for resource naming

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to create the security groups

Resources:

  # ── ALB Security Group 
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and HTTPS inbound from the internet to the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos

  # ── ECS Security Group 
  EcsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow port 8080 inbound from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSG
          Description: App port from ALB
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ecs-sg'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: fotos


Outputs:
  AlbSgId:
    Description: ALB Security Group ID
    Value: !Ref AlbSG
    Export:
      Name: !Sub '${EnvironmentName}-AlbSgId'

  EcsSgId:
    Description: ECS Security Group ID
    Value: !Ref EcsSG
    Export:
      Name: !Sub '${EnvironmentName}-EcsSgId'

  RdsSgId:
    Description: RDS Security Group ID
    Value: !Ref RdsSG
    Export:
      Name: !Sub '${EnvironmentName}-RdsSgId'

  RotationLambdaSgId:
    Description: Secrets Manager rotation Lambda security group ID
    Value: !Ref RotationLambdaSG
    Export:
      Name: !Sub '${EnvironmentName}-RotationLambdaSgId'
